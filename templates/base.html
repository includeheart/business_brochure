<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Business Brochure{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // Basic Tailwind configuration
        tailwind.config = {
            content: [],
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a',
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900">
    
    <!-- Navbar -->
    <nav class="bg-zinc-900 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <a href="/" class="text-2xl font-semibold tracking-tight">Your Business</a>
            
            <div class="flex items-center gap-x-8 text-sm font-medium">
                <a href="/" class="hover:text-sky-400 transition">Home</a>
                <a href="/about/" class="hover:text-sky-400 transition">About</a>
                <a href="/services/" class="hover:text-sky-400 transition">Services</a>
                <a href="/contact/" class="hover:text-sky-400 transition">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
