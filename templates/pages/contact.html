{% extends 'base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
    <div class="max-w-4xl mx-auto px-6 py-20">
        <h1 class="text-5xl font-semibold tracking-tight mb-8">Get In Touch</h1>
        <p class="text-xl text-zinc-600 mb-10">We'd love to hear from you. Reach out today!</p>

        <div class="grid md:grid-cols-2 gap-12">
            <!-- Contact Info -->
            <div>
                <h3 class="text-2xl font-medium mb-6">Contact Information</h3>
                <div class="space-y-6">
                    <p><strong>Email:</strong> hello@yourbusiness.com</p>
                    <p><strong>Phone:</strong> (305) 555-1234</p>
                    <p><strong>Location:</strong> Miami, Florida</p>
                </div>
            </div>

            <!-- Simple Contact Form (placeholder for now) -->
            <div>
                <form class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">Your Name</label>
                        <input type="text" class="w-full px-4 py-3 border border-zinc-300 rounded-2xl focus:outline-none focus:border-sky-400" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Email Address</label>
                        <input type="email" class="w-full px-4 py-3 border border-zinc-300 rounded-2xl focus:outline-none focus:border-sky-400" placeholder="you@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Message</label>
                        <textarea rows="5" class="w-full px-4 py-3 border border-zinc-300 rounded-3xl focus:outline-none focus:border-sky-400" placeholder="How can we help you?"></textarea>
                    </div>
                    <button type="submit" 
                            class="w-full bg-zinc-900 text-white py-4 rounded-2xl font-semibold hover:bg-sky-600 transition-colors">
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
