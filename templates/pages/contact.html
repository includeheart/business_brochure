<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
{% extends 'base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
    <div class="max-w-4xl mx-auto px-6 py-16">
        <h1 class="text-5xl font-semibold tracking-tight mb-8">Contact Us</h1>
        <p class="text-xl text-zinc-700 mb-8">Get in touch with us today.</p>
        
        <div class="bg-white p-8 rounded-3xl shadow-sm">
            <p class="mb-4"><strong class="block text-sm text-zinc-500">Email</strong> your@email.com</p>
            <p class="mb-4"><strong class="block text-sm text-zinc-500">Phone</strong> (305) 555-1234</p>
            <p><strong class="block text-sm text-zinc-500">Location</strong> Miami, Florida</p>
        </div>
    </div>
{% endblock %}
</body>
</html>
