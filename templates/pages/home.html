{% extends 'base.html' %}

{% block title %}Home - Your Business{% endblock %}

{% block content %}
    <!-- Hero -->
    <section class="bg-gradient-to-r from-zinc-900 to-sky-900 text-white py-24">
        <div class="max-w-4xl mx-auto text-center px-6">
            <h1 class="text-6xl font-semibold tracking-tight mb-6">
                Your Business Name
            </h1>
            <p class="text-xl text-zinc-300 mb-10">
                Professional solutions with a personal touch.
            </p>
            <a href="/contact/" 
               class="inline-block bg-white text-zinc-900 px-8 py-4 rounded-2xl font-semibold text-lg hover:bg-sky-400 hover:text-white transition">
                Get In Touch
            </a>
        </div>
    </section>

    <div class="max-w-7xl mx-auto px-6 py-16">
        <p class="text-center text-2xl font-semibold mb-4">Describe your business!</p>
        <p class="text-center text-zinc-600">Lorem ipsum dolor sit amet consectetur adipiscing elit...</p>
